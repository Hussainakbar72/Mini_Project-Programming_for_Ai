<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthBot UI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg, #3a7bd5, #00d2ff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Main Box */
.container {
    width: 380px;
    height: 580px;
    background: rgba(255,255,255,0.1);
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    backdrop-filter: blur(10px);
}

/* Header */
.header {
    padding: 15px;
    text-align: center;
    color: white;
    font-size: 18px;
    background: rgba(0,0,0,0.2);
}

/* Chat Area */
.chat-area {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

/* Messages */
.message {
    margin: 8px 0;
    padding: 10px;
    border-radius: 10px;
    max-width: 75%;
    font-size: 14px;
}

.bot {
    background: white;
    color: black;
}

.user {
    background: #00c6ff;
    color: white;
    margin-left: auto;
}

/* Input */
.input-box {
    display: flex;
    padding: 10px;
    background: rgba(0,0,0,0.1);
}

.input-box input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 20px;
    outline: none;
}

.input-box button {
    margin-left: 8px;
    padding: 10px 15px;
    border: none;
    background: #00c6ff;
    color: white;
    border-radius: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">Health Assistant</div>

    <div id="chat" class="chat-area"></div>

    <div class="input-box">
        <input id="msg" type="text" placeholder="Ask something...">
        <button onclick="send()">Send</button>
    </div>
</div>

<script>
const chat = document.getElementById("chat");

// Initial message
window.onload = () => {
    addMsg("bot", "Hello! I can help you with doctor info and appointments.");
};

function addMsg(type, text) {
    let div = document.createElement("div");
    div.className = "message " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function send() {
    let input = document.getElementById("msg");
    let text = input.value.trim();

    if (text === "") return;

    addMsg("user", text);
    input.value = "";

    try {
        let res = await fetch("/get_response", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: text})
        });

        let data = await res.json();

        setTimeout(() => {
            addMsg("bot", data.reply);
        }, 400);

    } catch (err) {
        addMsg("bot", "Server error. Try again.");
    }
}
</script>

</body>
</html>
